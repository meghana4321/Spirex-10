
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🌤 Weather App</h1>
        <p class="subtitle">Check the weather of any city</p>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name (e.g. Hyderabad)"
            >
            <button id="searchBtn">Search</button>
        </div>

        <p id="message"></p>

        <div class="weather-card" id="weatherCard" hidden>
            <h2 id="cityName"></h2>
            <p id="countryName"></p>

            <div class="weather-icon" id="weatherIcon">☀️</div>

            <h1 id="temperature">--°C</h1>
            <h3 id="condition">--</h3>

            <p id="weatherTime"></p>

            <div class="weather-details">
                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <h3 id="feelsLike">--°C</h3>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <h3 id="windSpeed">-- km/h</h3>
                </div>
            </div>
        </div>

        <footer>
            Weather data by
            <a href="https://open-meteo.com/" target="_blank">
                Open-Meteo
            </a>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
